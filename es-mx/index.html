    <script>
      (function () {
        var path = location.pathname;
        var marker = "/es-mx";
        var i = path.indexOf(marker);
        var baseHref =
          i >= 0
            ? path.slice(0, i + marker.length + 1)
            : path.endsWith("/")
              ? path
              : path.replace(/[^/]*$/, "");
        var base = document.createElement("base");
        base.href = baseHref;
        document.head.appendChild(base);
      })();
    </script>
